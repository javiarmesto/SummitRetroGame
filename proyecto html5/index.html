<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fruit Shooter - Retro Arcade Game</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>FRUIT SHOOTER</h1>
    <p>Classic Arcade Action - Smash the Falling Fruits!</p>
  </header>

  <main>
    <div class="game-container">
      <canvas id="game" width="800" height="600"></canvas>
      <div class="controls-info">
        <p><strong>Controls:</strong> Arrow Keys or WASD to Move | SPACEBAR to Shoot | H for History</p>
      </div>
    </div>
  </main>

  <footer>
    <p>Fruit Shooter - HTML5 Canvas Game</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
